{% extends "base.html" %}{% block title %}Customer{% endblock %}
{% block content %}
<div class="page-head"><div><p class="eyebrow">CUSTOMER MANAGEMENT</p><h1>{{ "Edit Customer" if customer else "Add Customer" }}</h1></div></div>
<div class="panel form-panel"><form method="post">
<label>Company Name *</label><input name="company_name" required value="{{ customer.company_name if customer else '' }}">
<label>Contact Person *</label><input name="contact_person" required value="{{ customer.contact_person if customer else '' }}">
<label>Email *</label><input type="email" name="email" required value="{{ customer.email if customer else '' }}">
<label>Phone</label><input name="phone" value="{{ customer.phone if customer else '' }}">
<label>Industry</label><input name="industry" value="{{ customer.industry if customer else '' }}">
<div class="actions"><a class="button" href="{{ url_for('customers') }}">Cancel</a><button class="button primary">Save Customer</button></div>
</form></div>
{% endblock %}
